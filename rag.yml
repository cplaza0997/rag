name: rag
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyterlab
  - nodejs
  - pip:
      - gradio==4.44.0
      - langchain==0.2.11
      - langchain-community==0.2.10
      - chromadb==0.4.24
      - pymupdf
      - docx2txt
      - pypdf==4.3.1
      - pydantic==2.9.1
      - jupyterlab-code-formatter
      - jupyterlab-execute-time
      - jupyterlab-lsp
      - python-lsp-server[all]
      
      # Hugging Face
      - transformers
      - sentence-transformers
      - datasets
      - huggingface-hub
      - accelerate

      # Ollama
      - langchain-ollama

      # PyTorch (CPU only)
      - torch==2.3.0+cpu
      - torchvision==0.18.0+cpu
      - torchaudio==2.3.0+cpu
      - --extra-index-url https://download.pytorch.org/whl/cpu
